name: Clean tracked dependencies

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  pages: write
  id-token: write

jobs:
  selenium-e2e-web-api-tests:
    name: Selenium E2E Web + API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Detect backend technology
        run: |
          chmod +x scripts/security/detect-stack.sh
          scripts/security/detect-stack.sh

      - name: Install Laravel dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan config:clear

      - name: Build frontend assets
        run: npm run build

      - name: Validate Selenium test driver
        run: |
          cd selenium-tests
          npm install
          node --check tests/login-tests.js

      - name: Run Laravel tests
        run: php artisan test

      - name: Run SAST and dependency checks
        run: |
          composer audit --format=plain | tee "Vulnerability Test Results/composer-audit.txt" || true
          npm audit --audit-level=low --json > "Vulnerability Test Results/npm-audit.json" || true
          node scripts/security/dast-smoke.js | tee "Vulnerability Test Results/dast-smoke.txt" || true

      - name: Upload Selenium and API artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selenium-api-test-artifacts
          path: |
            selenium-tests/**
            Vulnerability Test Results/**

  appium-mobile-tests-driver:
    name: Appium Mobile Tests Driver
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Appium test driver
        run: |
          cd appium-tests
          npm install
          node --check tests/app-e2e-tests.js
          echo "Appium driver is ready. Provide APP_PATH or APP_PACKAGE/APP_ACTIVITY to run against a real mobile build."

      - name: Upload Appium artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-test-artifacts
          path: appium-tests/**

  baseline-load-test-100-users:
    name: Baseline Load Test 100 Users
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate k6 baseline script
        run: |
          test -f load-tests/baseline-load-test.js
          echo "Baseline load test prepared for 100 virtual users over 1 minute."
          echo "Run with: BASE_URL=https://your-url.example k6 run load-tests/baseline-load-test.js"

      - name: Upload load test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baseline-load-test-artifacts
          path: load-tests/**

  deploy-to-github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: selenium-e2e-web-api-tests
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static report site
        run: |
          mkdir -p public
          cp "Vulnerability Test Results/executive-summary.md" public/index.md
          cp "Vulnerability Test Results/security-review.md" public/security-review.md
          cp "Vulnerability Test Results/dependency-report.md" public/dependency-report.md
          printf '<!doctype html><html><head><meta charset="utf-8"><title>CampusConnect Test Report</title></head><body><h1>CampusConnect Test Report</h1><ul><li><a href="index.md">Executive Summary</a></li><li><a href="security-review.md">Security Review</a></li><li><a href="dependency-report.md">Dependency Report</a></li></ul></body></html>' > public/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  generate-skillswap-test-report:
    name: Generate SkillSwap Test Report
    runs-on: ubuntu-latest
    needs:
      - selenium-e2e-web-api-tests
      - appium-mobile-tests-driver
      - baseline-load-test-100-users

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate final reports
        run: |
          node scripts/security/generate-security-artifacts.mjs
          cat "Vulnerability Test Results/executive-summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated Selenium, Appium, load testing, endpoint inventory, and security review artifacts." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-campusconnect-test-report
          path: |
            Vulnerability Test Results/**
            selenium-tests/**
            appium-tests/**
            load-tests/**
