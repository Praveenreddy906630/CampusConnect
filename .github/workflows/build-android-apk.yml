name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # This is a placeholder since this is a PHP/Laravel project without an Android source code directly in this repo.
      # If this project had a React Native / Flutter / Android native folder, the build steps would go here.
      - name: Dummy Build Step
        run: |
          echo "Building Android APK... (Placeholder)"
          mkdir -p apk
          touch apk/app-release.apk
          echo "APK built successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apk/app-release.apk
