name: Selenium E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pages-site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: selenium-tests
        run: npm install

      - name: Wait for Deployment Availability
        continue-on-error: true
        run: |
          echo "Verifying URL: ${{ needs.deploy.outputs.page_url }}"
          # Wait until we get a 200 OK response from the live deployment
          timeout 120 bash -c 'until curl -s -f -o /dev/null "${{ needs.deploy.outputs.page_url }}"; do echo "Waiting for deployment to be fully available..."; sleep 5; done' || echo "Deployment check completed."
          echo "Deployment check finished!"

      - name: Run Selenium Tests
        working-directory: selenium-tests
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
          HEADLESS: "true"
        run: npm run test:e2e || true

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation_Test_Reports
          path: selenium-tests/Test Results/

      - name: Publish Test Summary
        if: always()
        run: |
          if [ -f "selenium-tests/Test Results/Summary/summary.md" ]; then
            cat "selenium-tests/Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
