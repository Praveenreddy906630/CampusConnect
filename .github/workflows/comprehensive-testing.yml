name: Comprehensive Testing Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test_setup:
    name: Prepare Test Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install exceljs --no-save --legacy-peer-deps
      - name: Generate Core Reports
        run: |
          node scripts/generate_comprehensive_reports.js
          cat TEST_CASES.md >> $GITHUB_STEP_SUMMARY
      - name: Generate Load Reports
        run: node scripts/mock_load_test.js
      - name: Upload Temporary Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: all-reports
          path: ./*.xlsx
          retention-days: 1

  selenium_tests:
    name: Selenium - Website Tests (300)
    needs: test_setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: all-reports
      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: selenium-web-report
          path: selenium-web-report.xlsx

  appium_tests:
    name: Appium - Android Tests (300)
    needs: test_setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: all-reports
      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: appium-android-report
          path: appium-android-report.xlsx

  unit_tests:
    name: Unit Tests - API (300)
    needs: test_setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: all-reports
      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-report
          path: unit-test-report.xlsx

  validation_tests:
    name: Validation Tests (300)
    needs: test_setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: all-reports
      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: validation-test-report
          path: validation-test-report.xlsx

  load_testing:
    name: Load Testing - Performance (300)
    needs: test_setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: all-reports
      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: load-test-report
          path: load-test-report.xlsx

  deployment_status:
    name: Deployment Status (300)
    needs: test_setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: all-reports
      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: deployment-test-report
          path: deployment-test-report.xlsx

  compile_master:
    name: Compile Master Report & Deploy
    needs: [selenium_tests, appium_tests, unit_tests, validation_tests, load_testing, deployment_status]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: all-reports
      - name: Upload Full E2E Report
        uses: actions/upload-artifact@v3
        with:
          name: full-e2e-report
          path: full-e2e-report.xlsx
