name: Appium Mobile E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for gh-pages deployment
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: appium-tests
        run: npm install

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        run: |
          mkdir -p apk
          # Use curl to fetch the release APK
          curl -L -o apk/app-release.apk https://github.com/Praveenreddy906630/CampusConnect/releases/latest/download/app-release.apk || echo "Failed to download APK"

      - name: Install and Start Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium &
          sleep 10

      - name: Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_PATH: ${{ github.workspace }}/apk/app-release.apk
        with:
          api-level: 29
          target: default
          arch: x86
          profile: Nexus 6
          script: |
            cd appium-tests
            npm run test:app

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation_Test_Reports
          path: Test Results/

      - name: Prepare GitHub Pages Deployment Structure
        if: always()
        run: |
          mkdir -p gh-pages-deploy/reports/latest
          cp "Test Results/HTML/execution-report.html" gh-pages-deploy/reports/latest/ || true
          cp "Test Results/Summary/summary.md" gh-pages-deploy/reports/latest/ || true
          cp -r "Test Results/Screenshots" gh-pages-deploy/reports/latest/screenshots || true
          cp -r "Test Results/Logs" gh-pages-deploy/reports/latest/logs || true

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-deploy
          keep_files: true
